<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>引脚排序工具</title>
    <link rel="stylesheet" href="/iframe/css/PinSorting.css">
</head>
<body>
    <div class="row">
        <span>选中引脚数量：</span>
        <span id="pin-count">0</span>
    </div>

    <div class="row">
        <span>排序对象：</span>
        <div class="group">
            <label><input type="radio" name="sortTarget" value="pinName" checked>名称</label>
            <label><input type="radio" name="sortTarget" value="pinNumber">编号</label>
        </div>
    </div>

    <div class="row">  
        <label><input type="checkbox" id="splitSort" checked>拆分排序</label>
        <span>间距：</span>
        <input type="number" id="spacing" value="10"> 
    </div>

    <div class="row">  
        <label><input type="checkbox" id="endSort">末尾排序</label>
    </div>

    <div class="btn-group">
        <button id="btn-asc">升序</button>
        <button id="btn-desc">降序</button>
    </div>

    <script src="/iframe/js/app/PinSorting.js"></script>
</body>
</html>
