<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>狼黑工具 - 物理网络生成</title>
	<link rel="stylesheet" href="/iframe/css/GenerateNet.css">
</head>
<body>
<div class="app-container">
    <header>
        <div class="header-left">
            <span>通过</span>
            <select id="method-select">
                <option value="netlist">网表</option>
                <option value="source">源码</option>
                <option value="api">API</option>
            </select>
            <span>更新物理网络</span>
            <span id="api-warning" style="color: #dc3545; font-size: 12px; margin-left: 10px; display: none;">(此操作可能无法撤销)</span>
        </div>
        <div class="header-right">
            <button id="btn-refresh" class="btn btn-secondary">计算拓扑</button>
            <button id="btn-execute" class="btn btn-primary" disabled>写入</button>
        </div>
    </header>

    <div class="table-wrapper">
        <div class="grid-header grid-row-layout" id="grid-header">
            <div>图元ID</div>
            <div>类型</div>
            <div>旧网络</div>
            <div>新网络</div>
            <div>状态</div>
        </div>

        <div class="grid-body" id="result-list"></div>

        <div id="loading-mask">
            <div class="spinner"></div>
            <div id="loading-text"></div>
        </div>
    </div>

    <footer>
        <div class="progress-track">
            <div class="progress-fill" id="progress-bar"></div>
        </div>
        <div class="footer-info">
            <span id="status-left">就绪</span>
            <span id="status-right">-- / --</span>
        </div>
    </footer>
</div>

<script src="/iframe/js/app/GenerateNet.js"></script>
</body>
</html>
