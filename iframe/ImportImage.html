<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>狼黑工具 - 导入图片</title>
		<link rel="stylesheet" href="/iframe/css/common.css" />
		<style>
			/* ===== ImportImage 页面专属样式 ===== */
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
			}

			body {
				background-color: var(--vscode-bg);
				color: var(--vscode-text);
				height: 100vh;
				overflow: hidden;
			}

			.container {
				width: 100%;
				height: 100%;
				display: flex;
			}

			.preview-section {
				flex: 1;
				padding: 16px;
				border-right: 1px solid var(--vscode-border);
				display: flex;
				flex-direction: column;
				background-color: var(--vscode-bg);
			}

			.control-section {
				width: 340px;
				padding: 12px;
				display: flex;
				flex-direction: column;
				background-color: var(--vscode-panel);
				overflow-y: auto;
			}

			.preview-title,
			.section-title {
				font-size: 12px;
				text-transform: uppercase;
				letter-spacing: 0.5px;
				color: var(--vscode-text-bright);
				margin-bottom: 12px;
				display: flex;
				align-items: center;
			}

			.section-title {
				padding-bottom: 6px;
				border-bottom: 1px solid var(--vscode-border);
				margin-top: 20px;
			}

			.button-group {
				display: flex;
				gap: 8px;
				margin-bottom: 12px;
			}

			.btn {
				flex: 1;
				padding: 6px 12px;
				border: 1px solid transparent;
				border-radius: 2px;
				font-size: 12px;
				cursor: pointer;
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 6px;
				transition: background 0.1s;
			}

			.btn:disabled {
				background-color: var(--vscode-disabled-bg) !important;
				color: var(--vscode-text-disabled) !important;
				cursor: not-allowed;
				opacity: 1;
				width: 100%;
			}

			.btn-primary {
				background-color: var(--vscode-button-bg);
				color: var(--vscode-text-bright);
				width: 100%;
			}

			.btn-primary:hover:not(:disabled) {
				background-color: var(--vscode-button-hover);
			}

			.btn-secondary {
				background-color: var(--vscode-button-secondary);
				color: var(--vscode-text-bright);
				width: 100%;
			}

			.btn-secondary:hover:not(:disabled) {
				background-color: var(--vscode-button-secondary-hover);
			}

			.input-group {
				display: flex;
				gap: 16px;
				margin-bottom: 12px;
			}

			.input-column {
				flex: 1;
			}

			.input-row {
				display: flex;
				align-items: center;
				margin-bottom: 12px;
				gap: 8px;
			}

			.input-row label {
				width: 40px;
				font-size: 12px;
				color: var(--vscode-text);
			}

			.input-field {
				flex: 1;
				padding: 4px 6px;
				background-color: var(--vscode-input-bg);
				border: 1px solid transparent;
				border-radius: 2px;
				font-size: 12px;
				color: var(--vscode-syntax-number);
				font-family: Consolas, 'Courier New', monospace;
				width: 100%;
			}

			.input-field:focus {
				border-color: var(--vscode-focus);
				outline: none;
			}

			.input-field:disabled {
				opacity: 0.5;
			}

			.aspect-ratio {
				display: flex;
				align-items: center;
				margin-top: 8px;
				gap: 6px;
			}

			.aspect-ratio label {
				font-size: 12px;
				cursor: pointer;
			}

			.checkbox {
				width: 14px;
				height: 14px;
				accent-color: var(--vscode-focus);
				cursor: pointer;
				margin: 0;
			}

			.unit-selector,
			.layer-selector {
				display: flex;
				overflow: hidden;
				margin-top: 6px;
				margin-bottom: 8px;
			}

			.unit-option,
			.layer-option {
				flex: 1;
				padding: 4px 0;
				background-color: var(--vscode-input-bg);
				color: var(--vscode-text-muted);
				font-size: 12px;
				text-align: center;
				cursor: pointer;
				border-right: 1px solid var(--vscode-border);
				margin-bottom: 10px;
			}

			.unit-option:last-child,
			.layer-option:last-child {
				border-right: none;
			}

			.unit-option.active,
			.layer-option.active {
				background-color: var(--vscode-button-bg);
				color: var(--vscode-text-bright);
			}

			.dpi-section {
				width: 150px;
			}

			.custom-dpi {
				margin-top: 8px;
			}

			.custom-dpi .input-field {
				width: 100%;
			}

			.dpi-control-wrapper {
				display: flex;
				gap: 12px;
				align-items: stretch;
				height: 130px;
			}

			.dpi-values-list {
				display: flex;
				flex-direction: column;
				justify-content: space-between;
				flex: 1;
			}

			.dpi-value-item {
				font-size: 12px;
				color: var(--vscode-text-muted);
				cursor: pointer;
				font-family: Consolas, 'Courier New', monospace;
				padding: 2px 4px;
				border-radius: 2px;
				border: 1px solid transparent;
			}

			.dpi-value-item:hover {
				background-color: var(--vscode-list-hover);
			}

			.dpi-value-item.active {
				color: var(--vscode-syntax-type);
				background-color: rgba(78, 201, 176, 0.1);
				border-color: rgba(78, 201, 176, 0.3);
			}

			.slider-container {
				display: flex;
				justify-content: center;
				align-items: center;
			}

			.vertical-slider {
				-webkit-appearance: slider-vertical;
				width: 6px;
				height: 100%;
				background: var(--vscode-input-bg);
				border-radius: 3px;
				outline: none;
			}

			.vertical-slider::-webkit-slider-thumb {
				-webkit-appearance: none;
				width: 14px;
				height: 14px;
				background: var(--vscode-button-bg);
				border-radius: 2px;
				cursor: pointer;
			}

			.preview-box {
				flex: 1;
				border: 1px dashed var(--vscode-border);
				border-radius: 2px;
				display: flex;
				justify-content: center;
				align-items: center;
				overflow: hidden;
				background-color: var(--vscode-bg);
				transition: border 0.2s;
			}

			.preview-box:hover {
				border-color: var(--vscode-focus);
			}

			.preview-box img {
				max-width: 100%;
				max-height: 100%;
				object-fit: contain;
			}

			.preview-placeholder {
				text-align: center;
				color: var(--vscode-text-muted);
				font-size: 13px;
			}

			.preview-placeholder .icon {
				width: 32px;
				height: 32px;
				margin-bottom: 8px;
			}

			.grid-preview {
				width: 100%;
				height: 100%;
				display: grid;
				gap: 4px;
				background-color: var(--vscode-bg);
				padding: 8px;
				overflow: auto;
				align-content: start;
			}

			.grid-item {
				background-color: var(--vscode-input-bg);
				border-radius: 2px;
				border: 1px solid transparent;
				display: flex;
				align-items: center;
				justify-content: center;
				aspect-ratio: 1 / 1;
			}

			.grid-item img {
				width: 100%;
				height: 100%;
				object-fit: fill;
			}

			.icon {
				display: inline-block;
				width: 14px;
				height: 14px;
				background-size: contain;
				background-repeat: no-repeat;
			}

			.icon-export {
				background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23cccccc"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>');
			}

			.icon-image {
				background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23cccccc"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>');
			}

			.icon-upload {
				background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>');
			}

			.info-text {
				margin-top: auto;
				font-size: 12px;
				color: var(--vscode-text-muted);
				line-height: 1.6;
				padding: 10px;
				background-color: var(--vscode-bg);
				border: 1px solid var(--vscode-border);
				border-radius: 2px;
			}

			.info-text strong {
				color: var(--vscode-text);
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="preview-section">
				<div class="preview-title"><i class="icon icon-image"></i>图像预览</div>
				<div class="preview-box" id="previewBox">
					<div class="preview-placeholder">
						<i class="icon icon-image"></i>
						<p>请选择图像文件</p>
					</div>
					<img id="previewImage" alt="预览图像" style="display: none" />
					<div id="gridPreview" class="grid-preview" style="display: none"></div>
				</div>
			</div>
			<div class="control-section">
				<div class="input-group">
					<div class="input-column">
						<button class="btn btn-primary" id="selectImageBtn">
							<i class="icon icon-upload"></i>
							选择/更换图像
						</button>
						<div class="section-title">图像尺寸设置</div>
						<div class="unit-selector">
							<div class="unit-option" data-unit="mm">mm</div>
							<div class="unit-option active" data-unit="mil">mil</div>
						</div>
						<!-- <br /> -->
						<div class="input-row">
							<label>宽度:</label>
							<input type="number" class="input-field" id="widthInput" min="0" step="0.1" />
						</div>
						<div class="input-row">
							<label>高度:</label>
							<input type="number" class="input-field" id="heightInput" min="0" step="0.1" />
						</div>
						<div class="aspect-ratio">
							<input type="checkbox" class="checkbox" id="aspectRatioCheckbox" checked />
							<label for="aspectRatioCheckbox">保持横纵比</label>
						</div>
						<div class="aspect-ratio">
							<input type="checkbox" class="checkbox" id="sliceimport" />
							<label for="sliceimport">启用切片导入</label>
						</div>
					</div>
					<div class="dpi-section">
						<button class="btn btn-secondary" id="placeImageBtn" disabled>
							<i class="icon icon-export"></i>
							放置到画布上
						</button>
						<div class="section-title">DPI快速选择</div>
						<div class="dpi-control-wrapper">
							<div class="slider-container">
								<input type="range" id="dpiSlider" class="vertical-slider" min="0" max="5" step="1" value="2" />
							</div>
							<div class="dpi-values-list" id="dpiValuesList">
								<div class="dpi-value-item" data-dpi="300">300 DPI</div>
								<div class="dpi-value-item" data-dpi="600">600 DPI</div>
								<div class="dpi-value-item" data-dpi="900">900 DPI</div>
								<div class="dpi-value-item" data-dpi="1200">1200 DPI</div>
								<div class="dpi-value-item" data-dpi="2400">2400 DPI</div>
								<div class="dpi-value-item" data-dpi="4800">4800 DPI</div>
							</div>
						</div>
						<div class="custom-dpi">
							<input type="number" class="input-field" id="customDpiInput" min="1" placeholder="自定义 DPI 值" />
						</div>
					</div>
				</div>
				<div class="input-column">
					<div class="section-title">放置图层</div>
					<div class="layer-selector">
						<div class="layer-option" data-layer="TS">顶层丝印</div>
						<div class="layer-option" data-layer="BS">底层丝印</div>
						<div class="layer-option active" data-layer="DOC">文档层</div>
					</div>
					<br />
				</div>
				<div class="info-text">
					<strong>使用说明：</strong><br />
					1. 支持多选图片一次性导入，仅支持PNG/JPG/BMP格式<br />
					2. 图像分辨率较大 或 超过16384px，建议使用切片导入<br />
					3. 导入图片会占用大量显存，显存不够可能会无法打开
				</div>
			</div>
		</div>
		<script src="/iframe/js/common.js"></script>
		<script src="/iframe/js/app/ImportImage.js"></script>
	</body>
</html>
