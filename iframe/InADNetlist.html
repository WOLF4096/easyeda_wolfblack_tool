<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
		<title>导入 AD 网表</title>
		<link rel="stylesheet" href="/iframe/css/common.css" />
		<style>
			/* ===== InADNetlist 页面专属样式 ===== */
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
				background: var(--vscode-bg);
				color: var(--vscode-text);
				height: 100vh;
				width: 100%;
				overflow: hidden;
				display: flex;
				flex-direction: column;
			}

			.app-container {
				display: flex;
				flex-direction: column;
				height: 100%;
				width: 100%;
				background: var(--vscode-bg);
			}

			.toolbar {
				display: flex;
				justify-content: space-between;
				align-items: center;
				padding: 8px 14px;
				background: var(--vscode-panel);
				border-bottom: 1px solid var(--vscode-border);
				flex-wrap: wrap;
				gap: 12px;
			}

			.toolbar-left,
			.toolbar-right {
				display: flex;
				gap: 8px;
				align-items: center;
			}

			.btn {
				padding: 4px 12px;
				font-size: 12px;
				font-weight: normal;
				border-radius: 2px;
				cursor: pointer;
				transition: background 0.1s;
				border: 1px solid transparent;
				display: inline-flex;
				align-items: center;
				gap: 6px;
				font-family: inherit;
			}

			.btn-primary {
				background: var(--vscode-button-bg);
				color: var(--vscode-text-bright);
			}

			.btn-primary:hover {
				background: var(--vscode-button-hover);
			}

			.btn-outline {
				background: var(--vscode-button-secondary);
				color: var(--vscode-text);
			}

			.btn-outline:hover {
				background: var(--vscode-button-secondary-hover);
			}

			.info-bar {
				background: var(--vscode-bg);
				padding: 6px 14px;
				font-size: 12px;
				color: var(--vscode-text-muted);
				border-bottom: 1px solid var(--vscode-border);
				display: flex;
				justify-content: space-between;
				align-items: center;
			}

			.status-msg {
				display: flex;
				align-items: center;
				gap: 12px;
			}

			.badge {
				background: #2d2d30;
				padding: 2px 6px;
				border-radius: 2px;
				font-size: 11px;
				color: var(--vscode-text);
				border: 1px solid var(--vscode-border);
			}

			.table-wrapper {
				flex: 1;
				overflow: auto;
				background: var(--vscode-bg);
			}

			.net-table {
				width: 100%;
				border-collapse: collapse;
				font-size: 13px;
			}

			.net-table th {
				text-align: left;
				padding: 8px 14px;
				background-color: var(--vscode-panel);
				font-weight: normal;
				color: var(--vscode-text);
				box-shadow: 0 1px 0 var(--vscode-border);
				position: sticky;
				top: 0;
				z-index: 10;
				font-size: 12px;
			}

			.net-table td {
				padding: 6px 14px;
				border-bottom: 1px solid #2b2b2b;
				color: var(--vscode-text);
				font-family: Consolas, 'Courier New', monospace;
				font-size: 13px;
			}

			.net-table tr:hover td {
				background-color: var(--vscode-list-hover);
			}

			.net-table .warning-row td {
				background-color: rgba(204, 167, 0, 0.1);
				color: var(--vscode-warning);
			}

			.net-table .warning-row:hover td {
				background-color: rgba(204, 167, 0, 0.15);
			}

			.net-table td:first-child strong {
				color: var(--vscode-syntax-keyword);
				font-weight: normal;
			}

			.old-net {
				color: var(--vscode-text-muted);
			}

			.new-net {
				color: var(--vscode-syntax-type);
			}

			.diff-badge {
				background: rgba(78, 201, 176, 0.15);
				color: var(--vscode-syntax-type);
				border: 1px solid rgba(78, 201, 176, 0.3);
				font-size: 11px;
				padding: 0px 4px;
				border-radius: 2px;
				margin-left: 8px;
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
			}

			.empty-table-msg td {
				text-align: center;
				padding: 48px 20px !important;
				color: var(--vscode-text-muted);
				font-size: 13px;
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
				font-style: italic;
			}

			@media (max-width: 640px) {
				.toolbar {
					padding: 8px 10px;
				}
				.net-table th,
				.net-table td {
					padding: 6px 10px;
				}
			}
		</style>
	</head>
	<body>
		<div class="app-container">
			<div class="toolbar">
				<div class="toolbar-left">
					<button id="selectFileBtn" class="btn btn-outline">选择文件</button>
					<button id="pasteNetlistBtn" class="btn btn-outline">粘贴网表</button>
				</div>
				<div class="toolbar-right">
					<button id="writeNetlistBtn" class="btn btn-primary">写入网表</button>
				</div>
			</div>
			<div class="info-bar">
				<div class="status-msg">
					<span>当前网表已加载</span>
					<span id="adStatus" class="badge">未导入AD网表</span>
				</div>
				<div id="parseFeedback" style="font-size: 12px; color: #90cdf4"></div>
			</div>
			<div class="table-wrapper">
				<table class="net-table" id="netCompareTable">
					<thead>
						<tr>
							<th>位号</th>
							<th>引脚</th>
							<th>旧网络</th>
							<th>新网络</th>
						</tr>
					</thead>
					<tbody id="tableBody">
						<tr class="empty-table-msg">
							<td colspan="4">暂无网表对比数据，请先选择或粘贴AD格式网表</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>

		<script src="/iframe/js/common.js"></script>
		<script src="/iframe/js/app/InADNetlist.js"></script>
	</body>
</html>
