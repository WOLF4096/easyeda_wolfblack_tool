<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>导入 AD 网表</title>
	<link rel="stylesheet" href="/iframe/css/InADNetlist.css">
</head>
<body>
<div class="app-container">
    <div class="toolbar">
        <div class="toolbar-left">
            <button id="selectFileBtn" class="btn btn-outline">选择文件</button>
            <button id="pasteNetlistBtn" class="btn btn-outline">粘贴网表</button>
        </div>
        <div class="toolbar-right">
            <button id="writeNetlistBtn" class="btn btn-primary">写入网表</button>
        </div>
    </div>
    <div class="info-bar">
        <div class="status-msg">
            <span>当前网表已加载</span>
            <span id="adStatus" class="badge">未导入AD网表</span>
        </div>
        <div id="parseFeedback" style="font-size:12px; color:#90cdf4;"></div>
    </div>
    <div class="table-wrapper">
        <table class="net-table" id="netCompareTable">
            <thead>
                <tr><th>位号</th><th>引脚</th><th>旧网络</th><th>新网络</th></tr>
            </thead>
            <tbody id="tableBody">
                <tr class="empty-table-msg"><td colspan="4">暂无网表对比数据，请先选择或粘贴AD格式网表</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script src="/iframe/js/app/InADNetlist.js"></script>
</body>
</html>
