<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>狼黑工具 - 各种码生成器</title>
    <script src="js/bwip-js-min.js"></script>
    <script src="/iframe/js/bwip-js-min.js"></script>
    <style>
        /* VS Code 深色主题风格 */
        :root {
            --vscode-bg: #1e1e1e;
            --vscode-panel-bg: #252526;
            --vscode-border: #3c3c3c;
            --vscode-text: #cccccc;
            --vscode-text-focus: #ffffff;
            --vscode-input-bg: #3c3c3c;
            --vscode-focus-border: #007acc;
            --vscode-button-bg: #0e639c;
            --vscode-button-hover: #1177bb;
            --vscode-button-active: #094771;
            --vscode-error: #f48771;
            --vscode-scrollbar-bg: #1e1e1e;
            --vscode-scrollbar-thumb: #424242;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Consolas, "Microsoft YaHei", monospace;
            font-size: 12px;
        }

        body {
            background-color: var(--vscode-bg);
            color: var(--vscode-text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--vscode-scrollbar-bg); }
        ::-webkit-scrollbar-thumb { background: var(--vscode-scrollbar-thumb); }
        ::-webkit-scrollbar-thumb:hover { background: #4f4f4f; }

        /* 左侧预览区 */
        .preview-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-color: var(--vscode-bg);
            position: relative;
            overflow: auto;
        }

        .canvas-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px solid transparent;
            padding: 10px;
            transition: border-color 0.2s;
        }
        
        .canvas-wrapper:hover {
            border-color: var(--vscode-focus-border);
            border-radius: 4px;
        }

        canvas {
            display: block;
            width: 450px;
            /* height: 450px; */
            object-fit: contain;
            /* image-rendering: pixelated; */
            /* image-rendering: crisp-edges;  */
        }

        .error-message {
            margin-top: 15px;
            color: var(--vscode-error);
            max-width: 80%;
            text-align: center;
            word-wrap: break-word;
            min-height: 20px;
            font-size: 13px;
        }
        
        .info-hint {
            /* margin-top: 15px; */
            color: var(--vscode-text);
            /* background-color: var(--vscode-panel-bg); */
            /* padding: 8px 16px; */
            /* border-radius: 20px; */
            font-size: 20px;
            /* border: 1px solid var(--vscode-border); */
            /* pointer-events: none; */
        }

        /* 右侧属性面板 */
        .properties-panel {
            width: 300px;
            background-color: var(--vscode-panel-bg);
            border-left: 1px solid var(--vscode-border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .panel-header {
            padding: 10px 12px;
            font-size: 13px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--vscode-border);
            color: var(--vscode-text-focus);
            font-weight: bold;
        }

        .form-group {
            padding: 8px 12px;
            border-bottom: 1px solid var(--vscode-border);
        }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            color: var(--vscode-text);
        }

		.control-item {
			padding: 5px 0px;
		}
        .label-with-value {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .value-display {
            color: var(--vscode-focus-border);
            font-weight: bold;
            font-size: 11px;
        }

        select, input[type="text"], input[type="number"], textarea {
            width: 100%;
            background-color: var(--vscode-input-bg);
            border: 1px solid var(--vscode-border);
            color: var(--vscode-text-focus);
            padding: 4px 6px;
            outline: none;
            border-radius: 2px;
            transition: border-color 0.15s ease;
        }

        select:focus, input[type="text"]:focus, input[type="number"]:focus, textarea:focus {
            border-color: var(--vscode-focus-border);
        }

        input[type="range"] {
            width: 100%;
            margin-top: 4px;
            accent-color: var(--vscode-focus-border);
            background: transparent;
            cursor: pointer;
            height: 12px;
        }

        textarea {
            resize: vertical;
            min-height: 50px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-top: 4px;
        }

        .checkbox-group input[type="checkbox"] {
            margin-right: 6px;
            accent-color: var(--vscode-focus-border);
        }

        /* EDA 移植样式: 输出切换 / 单位切换 */
        .output-toggle, .unit-toggle {
            display: flex;
            border: 1px solid var(--vscode-border);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 2px;
        }

        .output-option, .unit-option {
            padding: 4px 0;
            background-color: var(--vscode-input-bg);
            color: var(--vscode-text);
            cursor: pointer;
            font-size: 12px;
            flex: 1;
            text-align: center;
        }

        .output-option.active, .unit-option.active {
            background-color: var(--vscode-button-bg);
            color: #ffffff;
        }
        
        .size-control {
            display: flex;
            align-items: center;
        }
        .size-control .unit-toggle { margin-top: 0; width: 80px; }

        .resolution-text {
            color: #9cdcfe;
            font-size: 12px;
            font-weight: normal;
            padding: 8px 0px;
        }

        .button-group {
            padding: 10px 12px;
            margin-top: auto;
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            background-color: var(--vscode-button-bg);
            color: #ffffff;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 2px;
        }

        button:hover { background-color: var(--vscode-button-hover); }
        button:active { background-color: var(--vscode-button-active); }

        #status-message {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            background: #4ec9b0;
            color: #1e1e1e;
            border-radius: 4px;
            font-weight: bold;
            display: none;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="preview-container">
        <div class="canvas-wrapper" id="canvas-wrapper" title="单击左侧条码放置到选定图层">
            <canvas id="barcode-canvas"></canvas>
        </div>
        <div id="error-message" class="error-message"></div>
        <div class="info-hint" id="place-hint">单击码可放置到 PCB 画布</div>
        <div id="status-message"></div>
    </div>

    <div class="properties-panel">
        <div class="panel-header">属性面板</div>
        
        <div class="form-group flex-group">
            <div class="control-item">
                <label for="barcode-type">码类型</label>
                <select id="barcode-type"></select>
            </div>

            <div class="control-item">
                <label for="barcode-data">数据内容</label>

            <div class="control-item" id="group-eclevel" style="display: none;">
                <label for="barcode-eclevel">容错级别</label>
                <select id="barcode-eclevel">
                    <option value="L">L - 7%</option>
                    <option value="M" selected>M - 15%</option>
                    <option value="Q">Q - 25%</option>
                    <option value="H">H - 30%</option>
                </select>
            </div>

            <div class="control-item" id="group-include-text" style="display: none;">
                <div class="checkbox-group">
                    <input type="checkbox" id="barcode-include-text" checked>
                    <label for="barcode-include-text" style="margin-bottom: 0;">显示文本信息</label>
                </div>
            </div>
        </div>

        <div class="form-group flex-group">
            <div class="control-item">
                <div class="label-with-value">
                    <label for="barcode-scale" style="margin-bottom: 0;">码元尺寸</label>
                    <span class="value-display" id="scale-value">32</span>
                </div>
                <input type="range" id="barcode-scale" value="32" min="1" max="50" step="1">
            </div>

            <div class="control-item">
                <div class="label-with-value">
                    <label for="barcode-padding" style="margin-bottom: 0;">码元边距</label>
                    <span class="value-display" id="padding-value">1</span>
                </div>
                <input type="range" id="barcode-padding" value="1" min="0" max="16" step="1">
            </div>

            <div class="control-item">
                <label>物理尺寸</label>
                <div class="size-control">
                    <input type="number" class="size-input" id="qr-size" value="1000" min="0.1" style="flex:1; margin-right: 10px;">
                    <div class="unit-toggle">
                        <div class="unit-option" id="unit-mm">mm</div>
                        <div class="unit-option active" id="unit-mil">mil</div>
                    </div>
                </div>
            </div>

            <div class="control-item">
                <div id="resolution-info" class="resolution-text">尺寸: 0 × 0 px | 0 DPI</div>
            </div>
        </div>

        <div class="form-group flex-group" style="border-bottom: none;">
            <div class="control-item">
                <label>显示类型</label>
                <div class="output-toggle">
                    <div class="output-option active" id="type-image">图片</div>
                    <div class="output-option" id="type-vector">矢量</div>
                </div>
            </div>

            <div class="control-item" id="image-controls">
                <div style="display: flex; gap: 10px;">
                    <div style="flex: 1;">
                        <label for="color-fore" style="margin-bottom: 4px;">前景色</label>
                        <input type="color" id="color-fore" value="#000000" style="width: 100%; height: 26px; cursor: pointer; border: 1px solid var(--vscode-border); background: var(--vscode-input-bg); padding: 0;">
                    </div>
                    <div style="flex: 1;">
                        <label for="color-back" style="margin-bottom: 4px;">背景色</label>
                        <input type="color" id="color-back" value="#ffffff" style="width: 100%; height: 26px; cursor: pointer; border: 1px solid var(--vscode-border); background: var(--vscode-input-bg); padding: 0;">
                    </div>
                </div>
            </div>

            <div class="control-item" id="vector-controls" style="display: none;">
                <div class="checkbox-group">
                    <input type="checkbox" id="invert-image">
                    <label for="invert-image" style="margin-bottom:0;">反向图像 (黑底白码)</label>
                </div>
            </div>

            <div class="control-item">
                <label for="layer-select">放置图层</label>
                <select id="layer-select" class="layer-select"></select>
            </div>
        </div>

        <div class="button-group">
            <button id="generate-btn">重新生成</button>
            <button id="save-btn">保存图片</button>
        </div>
    </div>

        function initEdaLayerMap() {
            if (typeof eda !== 'undefined' && typeof EPCB_LayerId !== 'undefined') {
                STATE.layerMap = {
                    'TOP': EPCB_LayerId.TOP,
                    'TOP_SILKSCREEN': EPCB_LayerId.TOP_SILKSCREEN,
                    'TOP_SOLDER_MASK': EPCB_LayerId.TOP_SOLDER_MASK,
                    'TOP_ASSEMBLY': EPCB_LayerId.TOP_ASSEMBLY,
                    'BOTTOM': EPCB_LayerId.BOTTOM,
                    'BOTTOM_SILKSCREEN': EPCB_LayerId.BOTTOM_SILKSCREEN,
                    'BOTTOM_SOLDER_MASK': EPCB_LayerId.BOTTOM_SOLDER_MASK,
                    'BOTTOM_ASSEMBLY': EPCB_LayerId.BOTTOM_ASSEMBLY,
                    'DOCUMENT': EPCB_LayerId.DOCUMENT,
                    'MECHANICAL': EPCB_LayerId.MECHANICAL,
                    'DRILL_DRAWING': EPCB_LayerId.DRILL_DRAWING,
                };
            } else {
                STATE.layerMap = { 'TOP_SILKSCREEN': 1 };
            }
        }

        function updateLayerOptions() {
            layerSelect.innerHTML = '';
            layerOptionsConfig[STATE.outputType].forEach(opt => {
                const option = document.createElement('option');
                option.value = opt.value;
                option.textContent = opt.text;
                if (opt.default) {
                    option.selected = true;
                    STATE.currentLayer = opt.value;
                }
                layerSelect.appendChild(option);
            });
        }

        function setOutputType(type) {
            STATE.outputType = type;
            const isImage = type === 'image';
            typeImageBtn.classList.toggle('active', isImage);
            typeVectorBtn.classList.toggle('active', !isImage);
            
            // 【修改】根据类型切换对应的控制面板
            vectorControls.style.display = isImage ? 'none' : 'block';
            imageControls.style.display = isImage ? 'block' : 'none';
            
            updateLayerOptions();
            generateBarcode();
        }

        function setUnit(unit) {
            if (STATE.unit === unit) return; // 如果已经是当前单位则不处理
            
            let currentVal = parseFloat(qrSizeInput.value) || 0;
            if (currentVal > 0) {
                if (unit === 'mil' && STATE.unit === 'mm') {
                    // mm 转换为 mil
                    qrSizeInput.value = (currentVal * EDA_CONFIG.MM_TO_MIL).toFixed(2);
                } else if (unit === 'mm' && STATE.unit === 'mil') {
                    // mil 转换为 mm
                    qrSizeInput.value = (currentVal / EDA_CONFIG.MM_TO_MIL).toFixed(2);
                }
            }

            STATE.unit = unit;
            unitMmBtn.classList.toggle('active', unit === 'mm');
            unitMilBtn.classList.toggle('active', unit === 'mil');
            generateBarcode();
        }

        function updateFormVisibility() {
            const bcid = selectElement.value;
            document.getElementById('group-eclevel').style.display = qrCodesWithEcl.includes(bcid) ? 'block' : 'none';
            document.getElementById('group-include-text').style.display = twoDCodesNoText.includes(bcid) ? 'none' : 'block';
        }

        function generateBarcode() {
            errorDiv.textContent = '';
            
            const bcid = selectElement.value;
            const text = dataInput.value;
            const scale = parseInt(scaleInput.value, 10);
            const padding = parseInt(paddingInput.value * 2, 10);
            const placeHint = document.getElementById('place-hint'); // 获取提示文字节点

            if (!text) {
                errorDiv.textContent = '输入数据不能为空。';
                resolutionInfo.textContent = '二维码尺寸: - × - px | - DPI';
                placeHint.style.display = 'none'; // 隐藏提示
                return;
            }

            // 处理颜色
            let barcolor = '000000';
            let bgcolor = 'ffffff';
            
            if (STATE.outputType === 'image') {
                // 【新增】图片模式下，读取取色器的值（需截掉前端的 '#' 符号）
                barcolor = colorForeInput.value.substring(1);
                bgcolor = colorBackInput.value.substring(1);
            } else if (STATE.outputType === 'vector' && invertCheckbox.checked) {
                // 矢量模式反转
                barcolor = 'ffffff';
                bgcolor = '000000';
            }

            let options = {
                bcid: bcid,
                text: text,
                scale: scale,
                padding: padding,
                textxalign: 'center',
                barcolor: barcolor,
                textcolor: barcolor,
                backgroundcolor: bgcolor
            };

            if (qrCodesWithEcl.includes(bcid)) options.eclevel = eclevelSelect.value;
            if (!twoDCodesNoText.includes(bcid)) options.includetext = includeTextInput.checked;

            try {
                // 【新增】记录生成开始时间
                const startTime = performance.now();

                bwipjs.toCanvas('barcode-canvas', options);
                
                // 【新增】记录生成结束时间并输出到控制台
                const endTime = performance.now();
                console.log(`二维码生成耗时: ${(endTime - startTime).toFixed(2)} ms`);
                
                const canvas = document.getElementById('barcode-canvas');
                let physSize = parseFloat(qrSizeInput.value) || 25.4;
                
                // 获取长边的像素大小，使 DPI 计算与长边物理尺寸匹配
                let maxPixels = Math.max(canvas.width, canvas.height);
                let dpi = 0;
                if (STATE.unit === 'mm') {
                    dpi = maxPixels * 25.4 / physSize;
                } else if (STATE.unit === 'mil') {
                    dpi = maxPixels * 1000 / physSize;
                }
                
                resolutionInfo.textContent = `尺寸: ${canvas.width} × ${canvas.height} px | ${Math.round(dpi)} DPI`;
                
                // 生成成功，显示提示文字，恢复包裹层的鼠标指针样式
                placeHint.style.display = 'block';
                canvasWrapper.style.cursor = 'pointer';
            } catch (e) {
                const canvas = document.getElementById('barcode-canvas');
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                errorDiv.textContent = '格式错误: ' + e.message;
                resolutionInfo.textContent = '尺寸: - × - px | - DPI';
                
                // 生成失败，隐藏提示文字，将指针设为不可点击状态
                placeHint.style.display = 'none';
                canvasWrapper.style.cursor = 'not-allowed';
            }
        }
		
        // ================= EDA 跟随与放置逻辑 ================= //
        function showToast(msg) {
            if (typeof eda !== 'undefined' && eda.sys_ToastMessage) {
                eda.sys_ToastMessage.showMessage(msg, 2);
            } else {
                const statusDiv = document.getElementById('status-message');
                statusDiv.textContent = msg;
                statusDiv.style.display = 'block';
                setTimeout(() => statusDiv.style.display = 'none', 3000);
            }
        }

        function getCurrentLayerId() {
            return STATE.layerMap[STATE.currentLayer] || (typeof EPCB_LayerId !== 'undefined' ? EPCB_LayerId.TOP_SILKSCREEN : 1);
        }

        async function handlePlaceQrCode() {
            const canvas = document.getElementById('barcode-canvas');
            if (canvas.width === 0) return;

            // 如果不在 EDA 环境内，提示点击保存
            if (typeof eda === 'undefined') {
                showToast('当前非 EDA 环境，请点击“保存图片”下载。');
                return;
            }

            try {
                stopFollowing();

                let width = parseFloat(qrSizeInput.value) || 25.4;
                // EDA API 参数如果是 mil 计算
                if (STATE.unit === 'mm') {
                    width *= EDA_CONFIG.MM_TO_MIL;
                }
                // 这里用长边作为基础缩放基准
                const aspectRatio = canvas.height / canvas.width;
                let height = width * aspectRatio;

                const layerId = getCurrentLayerId();
                const base64 = canvas.toDataURL('image/png');

                if (STATE.outputType === 'image') {
                    const colorObj = eda.pcb_PrimitiveObject.create(
                        layerId, 0, 0, base64,
                        width.toFixed(2), height.toFixed(2),
                        0, false, 'img', false
                    );
                    STATE.primitiveId = (await colorObj).getState_PrimitiveId();
                    startFollowing(eda.pcb_PrimitiveObject);
                } else {
                    const blob = await (await fetch(base64)).blob();
                    const edaImage = await eda.pcb_MathPolygon.convertImageToComplexPolygon(
                        blob, width.toFixed(2), height.toFixed(2),
                        0.5, 0, 0, 0, true, false
                    );
                    const noColorImg = eda.pcb_PrimitiveImage.create(
                        0, 0, edaImage, layerId,
                        width.toFixed(2), height.toFixed(2),
                        0, false, false
                    );
                    STATE.primitiveId = (await noColorImg).getState_PrimitiveId();
                    startFollowing(eda.pcb_PrimitiveImage);
                }

                // 尝试隐藏插件窗口(防止挡住视野)
                if (eda.sys_IFrame) eda.sys_IFrame.hideIFrame('ImportQrcode');
            } catch (err) {
                showToast('放置失败: ' + err.message);
                stopFollowing();
            }
        }

        function startFollowing(primitiveModule) {
            stopFollowing();
            STATE.followInterval = setInterval(async () => {
                try {
                    const pt = await eda.pcb_SelectControl.getCurrentMousePosition();
                    if (!pt) return;
                    const params = primitiveModule === eda.pcb_PrimitiveObject 
                        ? { topLeftX: pt.x, topLeftY: pt.y } 
                        : { x: pt.x, y: pt.y };
                    await primitiveModule.modify(STATE.primitiveId, params);
                } catch (e) {
                    stopFollowing();
                }
            }, 20);
        }

        function stopFollowing() {
            if (STATE.followInterval) {
                clearInterval(STATE.followInterval);
                STATE.followInterval = null;
            }
        }
        window.onblur = stopFollowing;

        // 初始化绑定事件
        window.addEventListener('load', () => {
            uncommonCodes.sort((a, b) => a.name.localeCompare(b.name));
            const renderOption = (item) => {
                const opt = document.createElement('option');
                opt.value = item.id;
                opt.textContent = `${item.name} (${item.cn})`;
                return opt;
            };
            commonCodes.forEach(item => selectElement.appendChild(renderOption(item)));
            const separator = document.createElement('option');
            separator.disabled = true;
            separator.textContent = '--------';
            selectElement.appendChild(separator);
            uncommonCodes.forEach(item => selectElement.appendChild(renderOption(item)));

            initEdaLayerMap();
            updateLayerOptions();
            updateFormVisibility();
            generateBarcode();

            // 滑轮切换码型
            selectElement.addEventListener('wheel', function(event) {
                event.preventDefault();
                let currentIndex = selectElement.selectedIndex;
                let direction = event.deltaY > 0 ? 1 : -1;
                let nextIndex = currentIndex + direction;
                while (nextIndex >= 0 && nextIndex < selectElement.options.length) {
                    if (!selectElement.options[nextIndex].disabled) {
                        selectElement.selectedIndex = nextIndex;
                        updateFormVisibility();
                        generateBarcode();
                        break;
                    }
                    nextIndex += direction;
                }
            });

			// 【新增】物理尺寸输入框的鼠标滚轮精确控制逻辑
            qrSizeInput.addEventListener('wheel', function(event) {
                // 阻止浏览器原生的滚动导致的小数点错乱行为
                event.preventDefault();

                let currentVal = parseFloat(this.value) || 0;
                
                // 根据当前设定的单位动态决定滚动步进：mil状态下步进1，mm状态下步进0.1
                let step = STATE.unit === 'mil' ? 1 : 0.1;
                
                // event.deltaY > 0 代表向下滚动（数值减），反之代表向上（数值加）
                let direction = event.deltaY > 0 ? -1 : 1;
                let nextVal = currentVal + (step * direction);

                // 读取输入框的最小限制值，防止滚成负数
                let minVal = parseFloat(this.min) || 0.1;
                if (nextVal < minVal) {
                    nextVal = minVal;
                }

                // 根据单位精确保留有效小数，mil无小数，mm保留2位，杜绝 1000.1 类似现象
                this.value = STATE.unit === 'mil' ? Math.round(nextVal) : nextVal.toFixed(2);

                // 滚动后立即刷新条码尺寸和 DPI 预览
                generateBarcode();
            });
			
            // 监听器
            selectElement.addEventListener('change', () => { updateFormVisibility(); generateBarcode(); });
            dataInput.addEventListener('input', generateBarcode);
            scaleInput.addEventListener('input', function() { scaleValueDisplay.textContent = this.value; generateBarcode(); });
            paddingInput.addEventListener('input', function() { paddingValueDisplay.textContent = this.value; generateBarcode(); });
            eclevelSelect.addEventListener('change', generateBarcode);
            includeTextInput.addEventListener('change', generateBarcode);
            qrSizeInput.addEventListener('input', generateBarcode);
            invertCheckbox.addEventListener('change', generateBarcode);
			// colorForeInput.addEventListener('input', generateBarcode);
            // colorBackInput.addEventListener('input', generateBarcode);

			// 【修改】图片颜色的节流（Throttle）控制逻辑
            let lastColorTime = 0;
            let colorTimeout = null;
            
            function throttledColorUpdate() {
                const now = Date.now();
                // 如果距离上次生成已经过了 200ms，立即生成
                if (now - lastColorTime >= 200) {
                    generateBarcode();
                    lastColorTime = now;
                } else {
                    // 如果在 200ms 内，则清除旧的定时器，重置延时，保证拖动停止时能渲染最终颜色
                    clearTimeout(colorTimeout);
                    colorTimeout = setTimeout(() => {
                        generateBarcode();
                        lastColorTime = Date.now();
                    }, 200 - (now - lastColorTime));
                }
            }

            // 使用节流函数替代直接绑定
            colorForeInput.addEventListener('input', throttledColorUpdate);
            colorBackInput.addEventListener('input', throttledColorUpdate);
			
            layerSelect.addEventListener('change', (e) => STATE.currentLayer = e.target.value);
            
            typeImageBtn.addEventListener('click', () => setOutputType('image'));
            typeVectorBtn.addEventListener('click', () => setOutputType('vector'));
            unitMmBtn.addEventListener('click', () => setUnit('mm'));
            unitMilBtn.addEventListener('click', () => setUnit('mil'));
            
            document.getElementById('generate-btn').addEventListener('click', generateBarcode);
            canvasWrapper.addEventListener('click', function() {
                const canvas = document.getElementById('barcode-canvas');
                // 通过判断 canvas 的宽度或者当前包裹层样式来决定是否执行放置逻辑
                if (canvas.width === 0 || canvasWrapper.style.cursor === 'not-allowed') {
                    return; // 处于禁用状态，直接拦截，不执行放置
                }
                handlePlaceQrCode();
            });
            // 保存功能
            document.getElementById('save-btn').addEventListener('click', function() {
                const canvas = document.getElementById('barcode-canvas');
                const rawText = dataInput.value;
                if (!rawText || canvas.width === 0) return; 
                let safeFileName = rawText.replace(/[\\/:*?"<>|\r\n]/g, '_').trim();
                if (safeFileName === '') safeFileName = 'barcode';
                const link = document.createElement('a');
                link.download = safeFileName + '.png';
                link.href = canvas.toDataURL('image/png');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });
        });

    </script>
</body>
