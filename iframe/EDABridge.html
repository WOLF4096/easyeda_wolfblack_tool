<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta http-equiv="Cache-Control" content="no-store" />
		<title>EDA 桥</title>
		<link rel="stylesheet" href="/iframe/css/common.css" />
	</head>
	<body>
		<div class="bridge-bar" id="bar">
			<span><span class="bridge-dot" id="dot"></span><span id="st">未连接</span></span>
			<input id="addr" type="text" value="127.0.0.1:8233" spellcheck="false" title="后端地址，格式 IP:端口" />
			<label title="开启后允许后端下发 eval 指令，在 EDA 里执行代码。仅用于插件自测，平时请关闭">
				<input id="allowEval" type="checkbox" />
				调试指令
			</label>
			<button id="conn">连接</button>
			<button class="btn-secondary" id="disc">断开</button>
		</div>

		<script src="/iframe/js/app/EDABridge.js"></script>
	</body>
</html>
