<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>狼黑工具 - 丝印代码转换</title>
		<link rel="stylesheet" href="/iframe/css/CodeConvert.css">
	</head>
	<body>
		<div class="container">
			<div class="header">
				<div class="title">
					丝印代码转换工具
					<span id="versionTag" class="version-tag">检测中...</span>
					只处理位号以C、R、L开头的元件
				</div>
				<div class="controls">
					<div class="select-all">
						<input type="checkbox" id="selectAll" style="transform: scale(1)" />
						<label for="selectAll">全选</label>
					</div>
					<button id="executeBtn" class="execute-btn">执行</button>
				</div>
			</div>

			<div class="table-container">
				<table id="componentsTable">
					<thead>
						<tr>
							<th style="width: 30px;" class="checkbox-cell">修改</th>
							<th style="width: 80px">位号</th>
							<th style="width: 80px">封装</th>
							<th style="width: 80px">代码/名称</th>
							<th style="width: 80px">转换值</th>
						</tr>
					</thead>
					<tbody id="tableBody"></tbody>
				</table>
			</div>

			<div id="status" class="status"></div>
		</div>

		<script src="/iframe/js/app/CodeConvert.js"></script>
	</body>
</html>
