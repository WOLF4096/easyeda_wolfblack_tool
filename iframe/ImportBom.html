<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>狼黑工具 - 导入BOM</title>
    <style>
        /* VSCode 深色主题全局变量与重置 */
        :root {
            --bg-color: #1e1e1e;
            --header-bg: #252526;
            --border-color: #3c3c3c;
            --text-main: #cccccc;
            --text-muted: #858585;
            --text-disabled: #666666;
            --btn-bg: #3c3c3c;
            --btn-hover: #4d4d4d;
            --accent-blue: #3794ff;
            --change-color: #4CAF50; /* 变化时的绿色高亮，更直观 */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: Consolas, "Courier New", monospace;
            font-size: 13px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 顶部工具栏 */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .title {
            font-size: 14px;
            font-weight: bold;
            color: var(--text-main);
        }

        .version-tag {
            font-size: 11px;
            font-weight: normal;
            background-color: var(--btn-bg);
            padding: 2px 4px;
            border-radius: 2px;
            color: var(--accent-blue);
            border: 1px solid var(--border-color);
        }

        .warning-text { 
            color: var(--text-main);
            font-size: 12px; 
        }

        .button-group { display: flex; gap: 6px; }

        button {
            background-color: var(--btn-bg);
            color: var(--text-main);
            border: 1px solid transparent;
            padding: 4px 12px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            border-radius: 2px;
            transition: background-color 0.1s;
        }

        button:hover:not(:disabled) { background-color: var(--btn-hover); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 列表容器 */
        .table-container {
            flex: 1;
            overflow-y: auto;
            padding: 0;
            position: relative;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        thead {
            position: sticky;
            top: 0;
            z-index: 20;
        }

        th, td {
            padding: 4px 8px;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        th {
            background-color: #2d2d30;
            font-weight: normal;
            color: #eeeeee;
            box-shadow: 0 1px 0 var(--border-color);
            border-bottom: none;
        }
        
        td {
            border-bottom: 1px solid var(--border-color);
        }

        /* --- 列宽分配 --- */
        th:nth-child(1), td:nth-child(1) { width: 20px; text-align: center; } /* 多选框 */
        th:nth-child(2), td:nth-child(2) { width: 80px; } /* 位号 */
        th:nth-child(3), td:nth-child(3) { width: 80px; } /* 名称 */

        /* 复选框样式 */
        input[type="checkbox"] {
            accent-color: var(--accent-blue);
            cursor: pointer;
            width: 14px; height: 14px;
            margin: 0; vertical-align: middle;
        }

        /* 状态样式 */
        .disabled-row {
            color: var(--text-disabled);
            background-color: rgba(0, 0, 0, 0.1);
        }
        .disabled-row input[type="checkbox"]:not(.row-selector) {
            opacity: 0.3; cursor: not-allowed;
        }
        
        .change-arrow {
            color: var(--change-color);
            margin: 0 4px;
            font-weight: bold;
        }

        /* 底部状态栏 */
        .status-bar {
            padding: 4px 12px;
            font-size: 12px;
            border-top: 1px solid var(--border-color);
            background-color: var(--header-bg);
            flex-shrink: 0;
            min-height: 20px;
            display: flex;
            align-items: center;
        }
        .status-bar.warning { color: #d7ba7d; } /* VSCode 警告黄 */
        .status-bar.success { color: var(--change-color); }
        .status-bar.error { color: #f14c4c; } /* VSCode 错误红 */

		/* --- 排序功能样式 --- */
        th.sortable {
            cursor: pointer;
            user-select: none; /* 防止双击时选中文本 */
            transition: background-color 0.1s;
        }
        th.sortable:hover {
            background-color: #3d3d40;
        }
        .sort-arrow {
            display: inline-block;
            width: 12px;
            font-size: 10px;
            color: var(--accent-blue);
            margin-left: 4px;
            text-align: center;
        }

    </style>
</head>
<body>
    <div class="toolbar">
        <div class="toolbar-left">
            <span class="title">导入BOM</span>
            <span id="versionTag" class="version-tag">检测中...</span>
            <span class="warning-text">必须按照以下字段排列后再从Excel复制粘贴</span>
        </div>
        <div class="button-group">
            <button id="pasteBtn">粘贴</button>
            <button id="selectAll">全选</button>
            <button id="importBtn" disabled>导入</button>
        </div>
    </div>

    <div class="table-container">
        <table id="bomTable">
            <thead>
                <tr>
                    <th><input type="checkbox" id="masterCheckbox" title="全选/取消全选" /></th>
                    <th class="sortable" data-key="designators">位号 <span class="sort-arrow"></span></th>
                    <th class="sortable" data-key="name">名称 <span class="sort-arrow"></span></th>
                    <th class="sortable" data-key="manufacturerPart">制造商编号 <span class="sort-arrow"></span></th>
                    <th class="sortable" data-key="manufacturer">制造商名称 <span class="sort-arrow"></span></th>
                    <th class="sortable" data-key="supplierPart">供应商编号 <span class="sort-arrow"></span></th>
                    <th class="sortable" data-key="supplier">供应商 <span class="sort-arrow"></span></th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="status-bar" id="statusBar">准备就绪</div>

    <script>
        // 全局变量
        let jsonData = {};
        let componentsMap = {}; 
        let tableData = [];
        let Page;
        let isV3 = false;
		let currentSortKey = null; // 当前排序的列名
        let currentSortAsc = true; // 是否升序

        // DOM元素
        const tableBody = document.getElementById('tableBody');
        const statusBar = document.getElementById('statusBar');
        const selectAllBtn = document.getElementById('selectAll');
        const pasteBtn = document.getElementById('pasteBtn');
        const importBtn = document.getElementById('importBtn');
        const masterCheckbox = document.getElementById('masterCheckbox');
        const versionTag = document.getElementById('versionTag');

        // 加载BOM数据
        async function loadBOMData() {
            try {
                tableData = [];
                for (const [key, component] of Object.entries(componentsMap)) {
                    if (!component || !component.props) continue;

                    const props = component.props;
                    
                    // 兼容性修复：部分基础元件（如电阻电容）的名字通常存在 Value 字段中
                    const compName = props.Name || props.Value || props.value || '';
                    const compDesignator = props.Designator || '';
                    
                    // 新增：提取封装属性用于后台分组判定
                    const compFootprint = props.FootprintName || props.Footprint || ''; 

                    tableData.push({
                        jsonKey: key, 
                        uniqueId: props['Unique ID'],
                        designator: compDesignator,
                        name: compName,
                        footprint: compFootprint, // 存入记录中
                        supplier: props.Supplier || '', 
                        supplierPart: props['Supplier Part'] || '',
                        manufacturerPart: props['Manufacturer Part'] || '',
                        manufacturer: props.Manufacturer || '',
                        selected: false,
                        changed: false,
                        original: {
                            designator: compDesignator,
                            name: compName,
                            supplier: props.Supplier || '', 
                            supplierPart: props['Supplier Part'] || '',
                            manufacturerPart: props['Manufacturer Part'] || '',
                            manufacturer: props.Manufacturer || '',
                        },
                    });
                }
                renderTable();
            } catch (error) {
                console.error('加载BOM数据失败:', error);
                statusBar.textContent = '加载BOM数据失败: ' + error.message;
                statusBar.className = 'status-bar error';
            }
        }

        // 渲染表格 (UI 核心修改点)
        function renderTable() {
            tableBody.innerHTML = '';

            const formatCell = (oldVal, newVal) => {
                if (newVal && newVal !== oldVal) {
                    return `${oldVal || '-'} <span class="change-arrow">→</span> ${newVal}`;
                }
                return oldVal || '-';
            };

            const formatTitle = (oldVal, newVal) => {
                if (newVal && newVal !== oldVal) {
                    return `${oldVal || '-'} → ${newVal}`;
                }
                return String(oldVal || '-');
            };

            const safeTitle = (str) => String(str).replace(/"/g, '&quot;');

            // 1. 动态对数据进行分组 (除位号以外的所有参数相同的分到一组)
            const groupedMap = {};
            const groupedView = [];

            tableData.forEach((item) => {
                // 核心修复点：提取位号的字母前缀 (如 R1 -> R, C12 -> C, IC1 -> IC)
                const prefix = (item.designator || '').replace(/[0-9]+$/, '');

                // 将封装 (item.footprint) 隐式加入到分组标识 (groupKey) 中
                const groupKey = `${prefix}|${item.footprint}|${item.name}|${item.supplier}|${item.supplierPart}|${item.manufacturerPart}|${item.manufacturer}|` +
                                 `${item.original.name}|${item.original.supplier}|${item.original.supplierPart}|${item.original.manufacturerPart}|${item.original.manufacturer}|${item.changed}`;

                if (!groupedMap[groupKey]) {
                    groupedMap[groupKey] = {
                        items: [], // 存储原始数据引用
                        designators: [],
                        name: item.name,
                        supplier: item.supplier,
                        supplierPart: item.supplierPart,
                        manufacturerPart: item.manufacturerPart,
                        manufacturer: item.manufacturer,
                        changed: item.changed,
                        original: item.original,
                        selected: item.selected
                    };
                    groupedView.push(groupedMap[groupKey]);
                }
                groupedMap[groupKey].items.push(item);
                groupedMap[groupKey].designators.push(item.designator);
                
                // 组内只要有一个没选中，则状态为非全选
                if (!item.selected) {
                    groupedMap[groupKey].selected = false;
                }
            });

			// 排序逻辑 
            if (currentSortKey) {
                groupedView.sort((a, b) => {
                    let valA, valB;

                    if (currentSortKey === 'designators') {
                        // 位号是数组，合并成字符串后再比对
                        valA = a.designators.join(', ');
                        valB = b.designators.join(', ');
                    } else {
                        // 其他属性直接读取字符串
                        valA = String(a[currentSortKey] || '');
                        valB = String(b[currentSortKey] || '');
                    }

                    // 使用 localeCompare 进行自然排序 (开启 numeric: true，使 C2 排在 C10 前面)
                    const compareResult = valA.localeCompare(valB, undefined, { numeric: true, sensitivity: 'base' });
                    
                    return currentSortAsc ? compareResult : -compareResult;
                });
            }

            // 2. 渲染分组后的数据
            groupedView.forEach((group) => {
                const row = document.createElement('tr');
                if (!group.selected) row.classList.add('disabled-row');

                // 复选框列
                const checkboxCell = document.createElement('td');
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'row-selector';
                checkbox.checked = group.selected;
                checkbox.addEventListener('change', () => {
                    const isChecked = checkbox.checked;
                    group.selected = isChecked;
                    // 同步勾选/取消勾选该组下的所有物理元件
                    group.items.forEach(it => it.selected = isChecked);
                    
                    if(isChecked) row.classList.remove('disabled-row');
                    else row.classList.add('disabled-row');
                    
                    updateMasterCheckbox();
                    updateSelectAllButton();
                });
                checkboxCell.appendChild(checkbox);
                row.appendChild(checkboxCell);

                // 位号列 (合并显示，以逗号分隔)
                const designatorCell = document.createElement('td');
                const desStr = group.designators.join(', ');
                designatorCell.textContent = desStr;
                designatorCell.title = desStr;
                row.appendChild(designatorCell);

                // 名称列
                const nameCell = document.createElement('td');
                nameCell.innerHTML = group.changed && group.name !== group.original.name ? formatCell(group.original.name, group.name) : (group.original.name || '-');
                nameCell.title = group.changed && group.name !== group.original.name ? safeTitle(formatTitle(group.original.name, group.name)) : safeTitle(group.original.name || '-');
                row.appendChild(nameCell);

                // 制造商编号列 (提前到这里)
                const manufacturerPartCell = document.createElement('td');
                manufacturerPartCell.innerHTML = group.changed && group.manufacturerPart !== group.original.manufacturerPart ? formatCell(group.original.manufacturerPart, group.manufacturerPart) : (group.original.manufacturerPart || '-');
                manufacturerPartCell.title = group.changed && group.manufacturerPart !== group.original.manufacturerPart ? safeTitle(formatTitle(group.original.manufacturerPart, group.manufacturerPart)) : safeTitle(group.original.manufacturerPart || '-');
                row.appendChild(manufacturerPartCell);

                // 制造商名称列 (提前到这里)
                const manufacturerCell = document.createElement('td');
                manufacturerCell.innerHTML = group.changed && group.manufacturer !== group.original.manufacturer ? formatCell(group.original.manufacturer, group.manufacturer) : (group.original.manufacturer || '-');
                manufacturerCell.title = group.changed && group.manufacturer !== group.original.manufacturer ? safeTitle(formatTitle(group.original.manufacturer, group.manufacturer)) : safeTitle(group.original.manufacturer || '-');
                row.appendChild(manufacturerCell);

                // 供应商编号(立创编号)列 (往后挪)
                const supplierPartCell = document.createElement('td');
                supplierPartCell.innerHTML = group.changed && group.supplierPart !== group.original.supplierPart ? formatCell(group.original.supplierPart, group.supplierPart) : (group.original.supplierPart || '-');
                supplierPartCell.title = group.changed && group.supplierPart !== group.original.supplierPart ? safeTitle(formatTitle(group.original.supplierPart, group.supplierPart)) : safeTitle(group.original.supplierPart || '-');
                row.appendChild(supplierPartCell);

                // 供应商列 (放在最后)
                const supplierCell = document.createElement('td');
                supplierCell.innerHTML = group.changed && group.supplier !== group.original.supplier ? formatCell(group.original.supplier, group.supplier) : (group.original.supplier || '-');
                supplierCell.title = group.changed && group.supplier !== group.original.supplier ? safeTitle(formatTitle(group.original.supplier, group.supplier)) : safeTitle(group.original.supplier || '-');
                row.appendChild(supplierCell);

                tableBody.appendChild(row);
            });
        }

        // 更新状态栏
        function updateStatusBar() {
            const uniqueIds = tableData.map((item) => item.uniqueId).filter((id) => id && id !== '');
            const hasEmptyUniqueId = tableData.some((item) => !item.uniqueId || item.uniqueId === '');
            const uniqueIdsSet = new Set(uniqueIds);
            const hasDuplicateUniqueId = uniqueIdsSet.size !== uniqueIds.length;

            if (hasEmptyUniqueId || hasDuplicateUniqueId) {
                let msg = '注意：';
                if (hasEmptyUniqueId) msg += '存在空的唯一ID; ';
                if (hasDuplicateUniqueId) msg += '存在重复的唯一ID; ';
                msg += '建议先重置唯一ID，否则可能导致异常。';

                statusBar.textContent = msg;
                statusBar.className = 'status-bar warning';
                importBtn.disabled = false;
            } else {
                statusBar.textContent = `数据加载成功 (${isV3 ? 'V3模式' : 'V2模式'})，可以粘贴并导入`;
                statusBar.className = 'status-bar success';
                importBtn.disabled = false;
            }
        }

        // 更新全选按钮文本
        function updateSelectAllButton() {
            const allSelected = tableData.length > 0 && tableData.every((item) => item.selected);
            selectAllBtn.textContent = allSelected ? '全不选' : '全选';
        }

        // 更新主复选框状态
        function updateMasterCheckbox() {
            const allSelected = tableData.length > 0 && tableData.every((item) => item.selected);
            const someSelected = tableData.some((item) => item.selected);
            masterCheckbox.checked = allSelected;
            masterCheckbox.indeterminate = someSelected && !allSelected;
        }

        // 主复选框状态更新
        masterCheckbox.addEventListener('change', function () {
            tableData.forEach((item) => {
                item.selected = masterCheckbox.checked;
            });
            renderTable();
            updateSelectAllButton();
        });

        // 全选/取消全选
        selectAllBtn.addEventListener('click', function () {
            const allSelected = tableData.every((item) => item.selected);
            tableData.forEach((item) => {
                item.selected = !allSelected;
            });
            renderTable();
            updateMasterCheckbox();
            updateSelectAllButton();
        });

        // 粘贴功能
        pasteBtn.addEventListener('click', async function () {
            try {
                const clipboardText = await navigator.clipboard.readText();
                const lines = clipboardText.trim().split('\n');
                const pasteData = [];

                const firstLine = lines[0];
                let delimiter = '\t';
                let designatorSeparator = ',';

                if (firstLine.includes('\t')) {
                    delimiter = '\t';
                    designatorSeparator = ',';
                } else {
                    delimiter = ',';
                    designatorSeparator = '、';
                }

                console.log(`[Debug] 检测到格式: 分隔符=${delimiter === '\t' ? 'TSV' : 'CSV'}, 位号分隔符=${designatorSeparator}`);

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;

                    const parts = line.split(delimiter);
                    const paddedParts = [...parts];
                    // 补齐 6 列 (位号|名称|制编|制名|供编|供名)
                    while (paddedParts.length < 6) paddedParts.push(''); 
                    const finalParts = paddedParts.slice(0, 6);

                    const designatorField = finalParts[0].trim();
                    let designators = [];

                    if (designatorField.includes(designatorSeparator)) {
                        designators = designatorField.split(designatorSeparator).map((d) => d.trim()).filter((d) => d);
                    } else {
                        designators = [designatorField];
                    }

                    pasteData.push({
                        designators: designators,
                        name: finalParts[1].trim(),
                        manufacturerPart: finalParts[2].trim(), // 第3列：制造商编号
                        manufacturer: finalParts[3].trim(),     // 第4列：制造商
                        supplierPart: finalParts[4].trim(),     // 第5列：供应商编号
                        supplier: finalParts[5].trim(),         // 第6列：供应商
                    });
                }

                let updateCount = 0;
                let matchedDesignators = new Set(); 

                for (const pasteItem of pasteData) {
                    for (const designator of pasteItem.designators) {
                        const tableItem = tableData.find((item) => item.designator === designator);

                        if (tableItem) {
                            // 优先使用 Excel 粘贴进来的供应商字段
                            let newSupplier = pasteItem.supplier;
                            
                            // 智能兼容：如果 Excel 里没填供应商，但供应商编号以 'C' 开头，依旧自动补全 LCSC
                            if (!newSupplier && pasteItem.supplierPart && pasteItem.supplierPart.trim().toUpperCase().startsWith('C')) {
                                newSupplier = 'LCSC';
                            }

                            const hasChanges =
                                pasteItem.name !== tableItem.original.name ||
                                pasteItem.manufacturerPart !== tableItem.original.manufacturerPart ||
                                pasteItem.manufacturer !== tableItem.original.manufacturer ||
                                pasteItem.supplierPart !== tableItem.original.supplierPart ||
                                newSupplier !== tableItem.original.supplier; // 增加供应商对比

                            if (hasChanges) {
                                tableItem.name = pasteItem.name;
                                tableItem.manufacturerPart = pasteItem.manufacturerPart;
                                tableItem.manufacturer = pasteItem.manufacturer;
                                tableItem.supplierPart = pasteItem.supplierPart;
                                tableItem.supplier = newSupplier; // 更新供应商
                                tableItem.changed = true;
                                tableItem.selected = true; 
                                updateCount++;
                                matchedDesignators.add(designator);
                            }
                        } else {
                            console.warn(`[Debug] 未找到位号: ${designator}`);
                        }
                    }
                }

                renderTable();
                updateMasterCheckbox(); 
                updateSelectAllButton();

                if (updateCount > 0) {
                    statusBar.textContent = `成功匹配并更新了 ${updateCount} 个组件的属性 (已自动勾选)`;
                    statusBar.className = 'status-bar success';
                } else {
                    statusBar.textContent = '没有检测到需要更新的属性，或数据无变化';
                    statusBar.className = 'status-bar warning';
                }
            } catch (error) {
                console.error('[Debug] 粘贴失败:', error);
                statusBar.textContent = '粘贴失败: ' + error.message;
                statusBar.className = 'status-bar error';
            }
        });

        // 导入功能
        importBtn.addEventListener('click', async function () {
            try {
                const selectedItems = tableData.filter((item) => item.selected);

                if (selectedItems.length === 0) {
                    statusBar.textContent = '请至少选择一个项目进行导入';
                    statusBar.className = 'status-bar warning';
                    return;
                }

                let successCount = 0;
                selectedItems.forEach((item) => {
                    if (item.jsonKey && componentsMap[item.jsonKey]) {
                        const comp = componentsMap[item.jsonKey];

                        comp.props.Name = item.name || item.original.name;
                        comp.props.Supplier = item.supplier || item.original.supplier; // 写入新供应商
                        comp.props['Supplier Part'] = item.supplierPart || item.original.supplierPart;
                        comp.props['Manufacturer Part'] = item.manufacturerPart || item.original.manufacturerPart;
                        comp.props.Manufacturer = item.manufacturer || item.original.manufacturer;

                        // (这里删除了原先硬编码的 C 开头写 LCSC 逻辑，因为粘贴阶段已经赋好值了)

                        item.changed = false;
                        item.original = {
                            designator: item.designator,
                            name: item.name,
                            supplier: item.supplier, // 同步 original
                            supplierPart: item.supplierPart,
                            manufacturerPart: item.manufacturerPart,
                            manufacturer: item.manufacturer,
                        };
                        successCount++;
                    }
                });

                const listjson = JSON.stringify(jsonData, null, 2);

                if (Page === 'PCB') {
                    await eda.pcb_Net.setNetlist('JLCEDA', listjson);
                } else {
                    await eda.sch_Netlist.setNetlist('JLCEDA', listjson);
                }

                statusBar.textContent = `成功导入并写回了 ${successCount} 个组件的属性`;
                statusBar.className = 'status-bar success';

                setTimeout(() => {
                    loadBOMData();
                }, 500);
            } catch (error) {
                console.error('[Debug] 导入失败:', error);
                statusBar.textContent = '导入失败: ' + error.message;
                statusBar.className = 'status-bar error';
            }
        });

        // 初始化
        document.addEventListener('DOMContentLoaded', async function () {
			
			// --- 新增：绑定表头排序点击事件 ---
            document.querySelectorAll('th.sortable').forEach(th => {
                th.addEventListener('click', function() {
                    const key = this.getAttribute('data-key');
                    
                    if (currentSortKey === key) {
                        // 点击相同的列，切换升降序
                        currentSortAsc = !currentSortAsc;
                    } else {
                        // 点击新的列，默认升序
                        currentSortKey = key;
                        currentSortAsc = true;
                    }

                    // 更新 UI 箭头显示
                    document.querySelectorAll('th.sortable .sort-arrow').forEach(span => span.textContent = '');
                    const arrowSpan = this.querySelector('.sort-arrow');
                    arrowSpan.textContent = currentSortAsc ? '▲' : '▼';

                    // 重新渲染表格应用排序
                    renderTable();
                });
            });

            try {
                if (typeof eda !== 'undefined' && eda.sys_Environment && eda.sys_Environment.getEditorCurrentVersion) {
                    const version = eda.sys_Environment.getEditorCurrentVersion();
                    console.log('[Debug] 当前EDA版本:', version);
                    if (version && version.toString().startsWith('3')) {
                        isV3 = true;
                        versionTag.textContent = 'V3模式';
                    } else {
                        versionTag.textContent = 'V2模式';
                    }
                } else {
                    versionTag.textContent = 'V2模式 (默认)';
                }
            } catch (e) {
                console.warn('[Debug] 版本检测失败', e);
                versionTag.textContent = '模式未知';
            }

            try {
                let getNetlist;
                let NetList;
                try {
                    getNetlist = await eda.pcb_ManufactureData.getNetlistFile('JLCEDA');
                    NetList = await getNetlist.text();
                    Page = 'PCB';
                } catch (error) {
                    getNetlist = await eda.sch_ManufactureData.getNetlistFile('JLCEDA');
                    NetList = await getNetlist.text();
                    Page = 'SCH';
                }
                
                jsonData = JSON.parse(NetList);

                if (isV3 && jsonData.components) {
                    componentsMap = jsonData.components;
                } else {
                    componentsMap = jsonData;
                }

                await loadBOMData();
                updateStatusBar();
            } catch (error) {
                console.error('[Debug] 初始化错误', error);
                statusBar.textContent = '初始化失败: 未能读取到画布环境数据';
                statusBar.className = 'status-bar error';
            }
        });
    </script>
</body>
</html>
