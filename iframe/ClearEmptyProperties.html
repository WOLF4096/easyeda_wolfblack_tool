<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清除属性工具</title>
    <style>
        /* VSCode 深色主题全局变量与重置 */
        :root {
            --bg-color: #1e1e1e;
            --header-bg: #252526;
            --border-color: #3c3c3c;
            --text-main: #cccccc;
            --text-muted: #858585;
            --btn-bg: #0e639c;
            --btn-hover: #1177bb;
            --accent-blue: #3794ff;
            --danger-bg: #c94a4a;
            --danger-hover: #d15a5a;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: Consolas, "Courier New", monospace;
            font-size: 13px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 顶部工具栏 */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .title {
            font-weight: bold;
            font-size: 14px;
        }

        .button-group { display: flex; gap: 8px; }

        button {
            background-color: var(--btn-bg);
            color: #ffffff;
            border: 1px solid transparent;
            padding: 5px 12px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            border-radius: 2px;
            transition: background-color 0.1s;
        }
        button:hover { background-color: var(--btn-hover); }
        button:disabled { background-color: #555; cursor: not-allowed; color: #aaa; }
        
        .btn-danger { background-color: var(--danger-bg); }
        .btn-danger:hover { background-color: var(--danger-hover); }

        /* 表格容器 */
        .table-container {
            flex: 1;
            overflow-y: auto;
            position: relative;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            text-align: left;
        }

        th, td {
            padding: 6px 8px;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        th {
            background-color: var(--header-bg);
            position: sticky;
            top: 0;
            z-index: 10;
            font-weight: normal;
            color: #eeeeee;
            box-shadow: 0 1px 0 var(--border-color);
            border-bottom: none;
            user-select: none;
        }

        .sortable { cursor: pointer; transition: color 0.1s; }
        .sortable:hover { color: var(--accent-blue); }
        .sort-icon { display: inline-block; width: 12px; margin-left: 2px; color: var(--accent-blue); font-size: 10px; }

        /* 列宽分配 (共8列) */
        th:nth-child(1), td:nth-child(1) { width: 40px; text-align: center; } /* 行多选 */
        th:nth-child(2), td:nth-child(2) { width: 80px; } /* 位号 */
        th:nth-child(3), td:nth-child(3) { width: 120px; } /* 名称 */
        th:nth-child(4), td:nth-child(4) { width: 120px; } /* 封装 */
        th:nth-child(5), td:nth-child(5) { width: 100px; } /* 供应商 */
        th:nth-child(6), td:nth-child(6) { width: 70px; text-align: center; } /* 基础 */
        th:nth-child(7), td:nth-child(7) { width: 70px; text-align: center; } /* 关键 */
        th:nth-child(8), td:nth-child(8) { width: 70px; text-align: center; } /* 更多 */

        input[type="checkbox"] {
            accent-color: var(--accent-blue);
            cursor: pointer;
            width: 14px; height: 14px;
            margin: 0; vertical-align: middle;
        }

        tbody tr:hover { background-color: #2a2d2e; }
        
        .disabled-row { opacity: 0.5; background-color: rgba(0, 0, 0, 0.2); }
        .disabled-row:hover { background-color: rgba(0, 0, 0, 0.2); }
        
        /* 交互型表头样式 */
        .col-cb-header { 
            cursor: pointer; 
            transition: color 0.1s;
        }
        .col-cb-header:hover {
            color: var(--accent-blue);
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <div class="title">清除多余属性</div>
        <div class="button-group">
            <button id="btnRefresh">刷新数据</button>
            <button id="btnClear" class="btn-danger">执行清空</button>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th><input type="checkbox" id="cbAllRows" title="全选/取消全选"></th>
                    <th class="sortable" data-sort="designator">位号<span class="sort-icon"></span></th>
                    <th class="sortable" data-sort="name">名称<span class="sort-icon"></span></th>
                    <th class="sortable" data-sort="footprint">封装<span class="sort-icon"></span></th>
                    <th class="sortable" data-sort="supplier">供应商<span class="sort-icon"></span></th>
                    <th class="col-cb-header" id="thAllBase" title="点击全选/取消全选基础属性">基础属性</th>
                    <th class="col-cb-header" id="thAllKey" title="点击全选/取消全选关键属性">关键属性</th>
                    <th class="col-cb-header" id="thAllMore" title="点击全选/取消全选更多属性">更多属性</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="8" style="text-align: center; padding: 20px; color: #888;">请点击“刷新数据”获取网表</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // 获取 EDA 环境上下文
        const sys_eda = window.parent.eda || window.eda;

        // 全局状态
        let rawNetlistData = null; 
        let dataSourceMode = 'PCB'; // 'PCB' 或 'SCH'
        let appData = [];
        let sortCol = null;
        let sortAsc = true;

        // 属性分类定义
        const whitelist = [
            "Convert to PCB", "Reuse Block", "Group ID", "Channel ID", 
            "PCB Layer", "Device", "Footprint", "Add into BOM",
            "FootprintName", "DeviceName", "SymbolName"
        ];
        
        const basePropsList = [
            "Name", "Unique ID", "Designator", "3D Model", 
            "3D Model Title", "3D Model Transform"
        ];
        
        const keyPropsList = [
            "Manufacturer", "Manufacturer Part", "Supplier", 
            "Supplier Part", "Value"
        ];

        // DOM 元素
        const tbody = document.getElementById('tableBody');
        const btnRefresh = document.getElementById('btnRefresh');
        const btnClear = document.getElementById('btnClear');
        const cbAllRows = document.getElementById('cbAllRows');
        
        const thAllBase = document.getElementById('thAllBase');
        const thAllKey = document.getElementById('thAllKey');
        const thAllMore = document.getElementById('thAllMore');

        // 1. 获取网表数据
        async function fetchNetlist() {
            if (!sys_eda) {
                alert("未检测到 EDA 运行环境！");
                return;
            }

            try {
                btnRefresh.disabled = true;
                btnRefresh.textContent = "获取中...";
                
                let getNetlist, netlistStr;
                try {
                    getNetlist = await sys_eda.pcb_ManufactureData.getNetlistFile('JLCEDA');
                    netlistStr = await getNetlist.text();
                    dataSourceMode = 'PCB';
                } catch (pcbErr) {
                    getNetlist = await sys_eda.sch_ManufactureData.getNetlistFile('JLCEDA');
                    netlistStr = await getNetlist.text();
                    dataSourceMode = 'SCH';
                }

                rawNetlistData = JSON.parse(netlistStr);
                
                let componentsSource = rawNetlistData.components ? rawNetlistData.components : rawNetlistData;
                
                appData = [];
                for (const key in componentsSource) {
                    const comp = componentsSource[key];
                    if (comp && comp.props && comp.props.Designator) {
                        const supplierVal = comp.props.Supplier || "";
                        const isEmptySupplier = supplierVal.trim() === "";

                        appData.push({
                            id: key,
                            designator: comp.props.Designator || "",
                            name: comp.props.Name || "",
                            // 优先读取 FootprintName，如果没有则降级读取 Footprint
                            footprint: comp.props.FootprintName || comp.props.Footprint || "",
                            supplier: supplierVal,
                            
                            // UI 勾选状态：Supplier为空时勾选行和"更多属性"，否则全不选
                            selected: isEmptySupplier,
                            clearBase: false,
                            clearKey: false,
                            clearMore: isEmptySupplier,
                            
                            refProps: comp.props 
                        });
                    }
                }

                sortCol = 'designator';
                sortAsc = true;
                sortData();
                renderTable();

                sys_eda.sys_Message.showToastMessage(`成功获取 ${appData.length} 个元件数据`, 'success');

            } catch (error) {
                console.error("网表获取失败:", error);
                sys_eda.sys_Message.showToastMessage("获取数据失败: " + error.message, 'error');
            } finally {
                btnRefresh.disabled = false;
                btnRefresh.textContent = "刷新数据";
            }
        }

        // 2. 渲染表格
        function renderTable() {
            if (appData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: #888;">未找到组件数据，请检查图纸</td></tr>';
                return;
            }

            tbody.innerHTML = appData.map((item, index) => {
                const rowClass = item.selected ? "" : "disabled-row";
                const disabledAttr = item.selected ? "" : "disabled";
                
                return `
                    <tr class="${rowClass}">
                        <td><input type="checkbox" class="cb-row" data-index="${index}" ${item.selected ? 'checked' : ''}></td>
                        <td title="${item.designator}">${item.designator}</td>
                        <td title="${item.name}">${item.name || '-'}</td>
                        <td title="${item.footprint}">${item.footprint || '-'}</td>
                        <td title="${item.supplier}">${item.supplier || '-'}</td>
                        <td><input type="checkbox" class="cb-base" data-index="${index}" ${item.clearBase ? 'checked' : ''} ${disabledAttr}></td>
                        <td><input type="checkbox" class="cb-key" data-index="${index}" ${item.clearKey ? 'checked' : ''} ${disabledAttr}></td>
                        <td><input type="checkbox" class="cb-more" data-index="${index}" ${item.clearMore ? 'checked' : ''} ${disabledAttr}></td>
                    </tr>
                `;
            }).join('');
            
            updateSelectAllRowState();
        }

        // 3. 排序逻辑
        function sortData() {
            if (!sortCol) return;
            appData.sort((a, b) => {
                let valA = a[sortCol] || "";
                let valB = b[sortCol] || "";
                
                return sortAsc 
                    ? valA.localeCompare(valB, undefined, { numeric: true })
                    : valB.localeCompare(valA, undefined, { numeric: true });
            });
        }

        // 4. 执行清空逻辑
        async function executeClear() {
            if (!sys_eda || !rawNetlistData || appData.length === 0) return;

            const selectedItems = appData.filter(item => item.selected && (item.clearBase || item.clearKey || item.clearMore));
            if (selectedItems.length === 0) {
                sys_eda.sys_Message.showToastMessage("没有勾选需要清空的属性或元件", "warning");
                return;
            }

            try {
                let processCount = 0;

                selectedItems.forEach(item => {
                    let isModified = false;
                    const props = item.refProps;

                    for (const key in props) {
                        if (whitelist.includes(key)) continue;

                        let isBase = basePropsList.includes(key);
                        let isKey = keyPropsList.includes(key);
                        let isMore = !isBase && !isKey;

                        let shouldClear = false;
                        if (isBase && item.clearBase) shouldClear = true;
                        if (isKey && item.clearKey) shouldClear = true;
                        if (isMore && item.clearMore) shouldClear = true;

                        if (shouldClear && props[key] !== "") {
                            props[key] = "";
                            isModified = true;
                        }
                    }

                    if (isModified) processCount++;
                });

                const updatedJsonString = JSON.stringify(rawNetlistData, null, 2);
                
                if (dataSourceMode === 'SCH') {
                    await sys_eda.sch_Netlist.setNetlist('JLCEDA', updatedJsonString);
                } else {
                    await sys_eda.pcb_Net.setNetlist('JLCEDA', updatedJsonString);
                }

                sys_eda.sys_Message.showToastMessage(`成功处理 ${processCount} 个元件`, 'success');
                // await fetchNetlist();

            } catch (error) {
                console.error('写回网表失败:', error);
                sys_eda.sys_Message.showToastMessage('执行失败: ' + error.message, 'error');
            }
        }

        // ================= 事件绑定 =================
        
        btnRefresh.addEventListener('click', fetchNetlist);
        btnClear.addEventListener('click', executeClear);

        // 表格内复选框点击处理
        tbody.addEventListener('change', (e) => {
            const target = e.target;
            if (target.tagName !== 'INPUT' || target.type !== 'checkbox') return;

            const index = parseInt(target.getAttribute('data-index'));
            const item = appData[index];

            if (target.classList.contains('cb-row')) {
                item.selected = target.checked;
                renderTable(); 
            } else if (target.classList.contains('cb-base')) {
                item.clearBase = target.checked;
            } else if (target.classList.contains('cb-key')) {
                item.clearKey = target.checked;
            } else if (target.classList.contains('cb-more')) {
                item.clearMore = target.checked;
            }
        });

        // 表头排序点击
        document.querySelectorAll('th.sortable').forEach(th => {
            th.addEventListener('click', () => {
                const col = th.getAttribute('data-sort');
                if (sortCol === col) {
                    sortAsc = !sortAsc;
                } else {
                    sortCol = col;
                    sortAsc = true;
                }
                
                document.querySelectorAll('.sort-icon').forEach(icon => icon.textContent = '');
                th.querySelector('.sort-icon').textContent = sortAsc ? '▲' : '▼';
                
                sortData();
                renderTable();
            });
        });

        // 行级全选/反选
        cbAllRows.addEventListener('change', (e) => {
            const checked = e.target.checked;
            appData.forEach(item => item.selected = checked);
            renderTable();
        });

        // 列级点击表头全选/反选逻辑
        const toggleColumnState = (field) => {
            // 仅对当前处于激活（已勾选）状态的行进行操作
            const activeItems = appData.filter(item => item.selected);
            if (activeItems.length === 0) return;

            // 判断是否所有的激活行都已勾选了该属性列
            const isAllChecked = activeItems.every(item => item[field]);
            // 如果全勾选了，目标状态就是取消勾选；反之则全部勾选
            const targetState = !isAllChecked;

            activeItems.forEach(item => item[field] = targetState);
            renderTable();
        };

        thAllBase.addEventListener('click', () => toggleColumnState('clearBase'));
        thAllKey.addEventListener('click', () => toggleColumnState('clearKey'));
        thAllMore.addEventListener('click', () => toggleColumnState('clearMore'));

        // 更新左上角总行多选框状态
        function updateSelectAllRowState() {
            if (appData.length === 0) return;
            const allRowsChecked = appData.every(item => item.selected);
            const someRowsChecked = appData.some(item => item.selected);
            cbAllRows.checked = allRowsChecked;
            cbAllRows.indeterminate = someRowsChecked && !allRowsChecked;
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            if (sys_eda) fetchNetlist();
        });

    </script>
</body>
</html>
