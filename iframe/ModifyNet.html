<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>狼黑工具 - 批量修改网络 与 引脚查询工具</title>
	<link rel="stylesheet" href="/iframe/css/ModifyNet.css">
</head>
<body>
<div class="container">
    <div class="header">
        <h1>网络修改 & 查询工具 <span id="verLabel" class="version-info"></span></h1>
        <button id="executeBtn" class="execute-btn">执行替换</button>
    </div>
    <div class="content">
        <div class="input-section">
            <label for="csvInput">替换规则，从 Excel 复制粘贴：</label>
            <textarea id="csvInput" placeholder="旧网络名称	新网络名称&#10;(直接从Excel复制粘贴，使用Tab分隔)"></textarea>
        </div>

        <div class="result-section">
            <div class="search-section">
                <label for="designatorInput" style="margin-bottom: 0">查询引脚：</label>
                <input type="text" id="designatorInput" class="search-input" placeholder="输入位号 (如 U1)" />
            </div>

            <label for="resultOutput">输出结果：</label>
            <textarea
                    id="resultOutput"
                    class="result-textarea"
                    readonly
                    placeholder="在此输入位号查看引脚网络，或点击执行查看替换结果..."
            ></textarea>
            <div id="status" class="status"></div>
        </div>
    </div>
</div>

<script src="/iframe/js/app/ModifyNet.js"></script>
</body>
</html>
