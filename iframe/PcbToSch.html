<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
		<title>狼黑工具 - PCB转原理图工具</title>
		<script src="/iframe/js/jszip.min.js"></script>
		<link rel="stylesheet" href="/iframe/css/common.css" />
		<style>
			/* ===== PcbToSch 页面专属样式 ===== */
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
			}

			body {
				background: var(--vscode-bg);
				height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				color: var(--vscode-text);
			}

			.frame {
				width: 100%;
				height: 100%;
				max-width: 1400px;
				background: var(--vscode-bg);
				display: flex;
				flex-direction: column;
				overflow: hidden;
			}

			.tool-header {
				padding: 10px 16px;
				border-bottom: 1px solid var(--vscode-border);
				background: var(--vscode-panel);
				display: flex;
				align-items: center;
			}

			.tool-header h1 {
				font-weight: normal;
				font-size: 13px;
				display: flex;
				align-items: center;
				gap: 12px;
				width: 100%;
				text-transform: uppercase;
				letter-spacing: 0.5px;
				color: var(--vscode-text-bright);
			}

			.tool-header h1 span {
				font-family: Consolas, monospace;
				font-size: 12px;
				color: var(--vscode-text-muted);
				padding: 1px 6px;
				border-radius: 2px;
				text-transform: none;
			}

			#exportCsvBtn {
				background: var(--vscode-button-secondary);
				border: 1px solid transparent;
				color: var(--vscode-text-bright);
				padding: 4px 12px;
				font-size: 12px;
				cursor: pointer;
				border-radius: 2px;
				margin-left: auto;
				transition: 0.1s;
			}

			#exportCsvBtn:hover {
				background: var(--vscode-button-secondary-hover);
			}

			#exportNetBtn {
				background: var(--vscode-button-secondary);
				border: 1px solid transparent;
				color: var(--vscode-text-bright);
				padding: 4px 12px;
				font-size: 12px;
				cursor: pointer;
				border-radius: 2px;
				transition: 0.1s;
			}

			#exportNetBtn:hover {
				background: var(--vscode-button-secondary-hover);
			}

			.list-section {
				flex: 1 1 0;
				min-height: 0;
				display: flex;
				flex-direction: column;
			}

			.table-container {
				background: var(--vscode-bg);
				display: flex;
				flex-direction: column;
				flex: 1 1 0;
				min-height: 0;
			}

			.table-header {
				display: grid;
				grid-template-columns: 80px 80px 120px 120px 120px 1fr;
				background: var(--vscode-panel);
				border-bottom: 1px solid var(--vscode-border);
				color: var(--vscode-text);
				font-weight: normal;
				font-size: 12px;
				box-shadow: 0 1px 0 var(--vscode-border);
				z-index: 10;
			}

			.header-cell {
				padding: 6px;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				border-right: 1px solid var(--vscode-border);
			}

			.header-cell:last-child {
				border-right: none;
			}

			.table-rows {
				overflow-y: auto;
				flex: 1;
				background: var(--vscode-bg);
			}

			.grid-row {
				display: grid;
				grid-template-columns: 80px 80px 120px 120px 120px 1fr;
				border-bottom: 1px solid #2b2b2b;
				background: var(--vscode-bg);
			}

			.grid-row:hover {
				background: var(--vscode-list-hover);
			}

			.row-cell {
				padding: 6px;
				color: var(--vscode-text);
				font-size: 13px;
				font-family: Consolas, 'Courier New', monospace;
				display: flex;
				align-items: center;
				border-right: 1px solid #2b2b2b;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}

			.row-cell:first-child {
				color: var(--vscode-syntax-keyword);
			}

			.row-cell:last-child {
				border-right: none;
				padding: 3px 6px;
			}

			.manual-input {
				width: 100%;
				background: var(--vscode-input-bg);
				border: 1px solid transparent;
				border-radius: 2px;
				padding: 4px 6px;
				color: var(--vscode-syntax-string);
				font-size: 12px;
				outline: none;
				font-family: Consolas, 'Courier New', monospace;
			}

			.manual-input:focus {
				border-color: var(--vscode-focus);
			}

			.manual-input::placeholder {
				color: var(--vscode-text-muted);
			}

			.bottom-panel {
				background: var(--vscode-panel);
				border-top: 1px solid var(--vscode-border);
				flex-shrink: 0;
			}

			.options-row {
				display: flex;
				flex-wrap: wrap;
				border-bottom: 1px solid var(--vscode-border);
			}

			.option-group {
				flex: 1 1 240px;
				padding: 12px 16px;
				border-right: 1px solid var(--vscode-border);
			}

			.option-group:last-child {
				border-right: none;
			}

			.group-title {
				color: var(--vscode-text);
				font-weight: normal;
				font-size: 11px;
				margin-bottom: 10px;
				text-transform: uppercase;
				letter-spacing: 0.5px;
			}

			.radio-list,
			.checkbox-list {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 8px 16px;
			}

			.radio-item,
			.check-item {
				display: flex;
				align-items: center;
				gap: 6px;
				color: var(--vscode-text);
				font-size: 12px;
				white-space: nowrap;
				cursor: pointer;
			}

			input[type='radio'],
			input[type='checkbox'] {
				accent-color: var(--vscode-focus);
				width: 13px;
				height: 13px;
				margin: 0;
				cursor: pointer;
			}

			.action-bar {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				justify-content: space-between;
				padding: 10px 16px;
			}

			.agree-area {
				display: flex;
				align-items: center;
				gap: 6px;
				color: var(--vscode-text);
				font-size: 12px;
			}

			.disclaimer-link {
				color: var(--vscode-focus);
				cursor: pointer;
				padding: 0;
				text-decoration: none;
			}

			.disclaimer-link:hover {
				text-decoration: underline;
			}

			.button-group {
				display: flex;
				gap: 8px;
			}

			.primary-btn,
			.secondary-btn {
				border: 1px solid transparent;
				border-radius: 2px;
				padding: 4px 14px;
				font-size: 12px;
				cursor: pointer;
				transition: 0.1s;
			}

			.primary-btn {
				background: var(--vscode-button-bg);
				color: var(--vscode-text-bright);
			}

			.primary-btn:hover:not(:disabled) {
				background: var(--vscode-button-hover);
			}

			.secondary-btn {
				background: var(--vscode-button-secondary);
				color: var(--vscode-text-bright);
			}

			.secondary-btn:hover:not(:disabled) {
				background: var(--vscode-button-secondary-hover);
			}

			button:disabled {
				background: var(--vscode-disabled-bg) !important;
				color: var(--vscode-text-disabled) !important;
				cursor: not-allowed;
			}

			.progress-area {
				background: var(--vscode-accent);
				height: 24px;
				position: relative;
				display: flex;
				align-items: center;
				overflow: hidden;
			}

			.progress-fill {
				position: absolute;
				top: 0;
				left: 0;
				height: 100%;
				width: 0%;
				background: rgba(255, 255, 255, 0.2);
				transition: width 0.2s ease;
				z-index: 1;
			}

			.progress-text {
				position: relative;
				z-index: 2;
				color: var(--vscode-text-bright);
				font-size: 12px;
				padding: 0 16px;
				white-space: nowrap;
			}

			.modal-overlay {
				display: none;
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background: rgba(0, 0, 0, 0.6);
				align-items: center;
				justify-content: center;
				z-index: 1000;
			}

			.modal-card {
				background: var(--vscode-panel);
				max-width: 85vw;
				max-height: 80vh;
				overflow-y: auto;
				padding: 20px;
				border: 1px solid var(--vscode-border);
				box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
				border-radius: 2px;
			}

			.modal-card h3 {
				font-size: 13px;
				font-weight: normal;
				margin-bottom: 16px;
				color: var(--vscode-error);
				text-transform: uppercase;
				border-left: 3px solid var(--vscode-error);
				padding-left: 8px;
			}

			.disclaimer-content {
				color: var(--vscode-text);
				font-size: 12px;
				line-height: 1.6;
				margin-bottom: 20px;
			}

			.disclaimer-content p {
				margin-bottom: 8px;
			}

			.modal-close {
				background: var(--vscode-button-secondary);
				border: 1px solid transparent;
				border-radius: 2px;
				color: white;
				padding: 4px 16px;
				font-size: 12px;
				float: right;
				cursor: pointer;
			}

			.modal-close:hover {
				background: var(--vscode-button-secondary-hover);
			}

			.row-error {
				background-color: rgba(241, 76, 76, 0.1) !important;
				color: var(--vscode-error) !important;
			}

			.row-error:hover {
				background-color: rgba(241, 76, 76, 0.15) !important;
			}

			.row-error .row-cell {
				color: var(--vscode-error);
			}
		</style>
	</head>
	<body>
		<div class="frame">
			<div class="tool-header">
				<h1>
					PCB转原理图工具
					<span id="versionDisplay" style="font-size: 0.8rem; color: var(--vscode-text-disabled)">检测EDA环境...</span>
				</h1>
			</div>

			<!-- 列表部分 -->
			<div class="list-section" id="listSection">
				<div class="table-container">
					<div class="table-header">
						<div class="header-cell">位号</div>
						<div class="header-cell">名称</div>
						<div class="header-cell">封装</div>
						<div class="header-cell">器件</div>
						<div class="header-cell">匹配符号</div>
						<div class="header-cell">指定符号</div>
					</div>
					<div class="table-rows" id="tableRows"></div>
				</div>
			</div>

			<!-- 底部面板 -->
			<div class="bottom-panel">
				<div class="options-row">
					<div class="option-group">
						<div class="group-title">分类</div>
						<div class="radio-list">
							<label class="radio-item"><input type="radio" name="classify" value="device" /> 按照器件分类</label>
							<label class="radio-item"><input type="radio" name="classify" value="ref" checked /> 按照位号分类</label>
							<label class="radio-item"><input type="radio" name="classify" value="pkg" /> 按照封装分类</label>
							<label class="radio-item"><input type="radio" name="classify" value="coord" /> 按照元件坐标</label>
						</div>
					</div>
					<div class="option-group">
						<div class="group-title">更多选项</div>
						<div class="checkbox-list">
							<label class="check-item"><input type="checkbox" id="genTitle" checked /> 显示分类标题</label>
							<label class="check-item"><input type="checkbox" id="genWire" checked /> 尝试生成导线</label>
							<label class="check-item"><input type="checkbox" id="yvalue" /> 启用 Y 值翻转</label>
							<label class="check-item"><input type="checkbox" id="errors" /> 忽略符号错误</label>
						</div>
					</div>
				</div>

				<div class="action-bar">
					<div class="agree-area">
						<!-- <input type="checkbox" id="agreeCheck">
                    <label for="agreeCheck">同意</label>
                    <span class="disclaimer-link" id="showDisclaimerBtn">《免责声明》</span> -->
					</div>
					<div class="button-group">
						<button class="secondary-btn" id="refreshListBtn">加载数据</button>
						<button class="secondary-btn" id="buildBtn" disabled>构建源码</button>
						<button class="primary-btn" id="writeBtn" disabled>写入文档</button>
						<button class="primary-btn" id="outfile" disabled>导出文件</button>
						<button class="secondary-btn" id="exportCsvBtn" disabled>导出表格</button>
						<button class="secondary-btn" id="exportNetBtn" disabled>导出网络</button>
					</div>
				</div>

				<div class="progress-area" id="progressArea">
					<div class="progress-fill" id="progressFill" style="width: 0%"></div>
					<div class="progress-text" id="progressText">就绪</div>
				</div>
			</div>
		</div>

		<script src="/iframe/js/common.js"></script>
		<script src="/iframe/js/app/PcbToSch.js"></script>
	</body>
</html>
